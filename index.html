<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="description" content="记录喝水量，在里程碑处播放畅畅的救援故事。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="畅畅的救援手册">
  <title>畅畅的救援手册</title>
  <link rel="icon" href="assets/manual-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/manual-icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <header class="topbar">
      <button class="manual-entry" type="button" id="manualButton" aria-haspopup="dialog">
        <span class="manual-mark" aria-hidden="true">畅</span>
        <span class="manual-entry-copy">
          <strong>畅畅的救援手册</strong>
          <small>回忆已经解锁的章节</small>
        </span>
        <span class="manual-count" id="manualCount">1 / 12</span>
      </button>
    </header>

    <main class="home">
      <section class="water-card" aria-labelledby="pageTitle">
        <p class="eyebrow">WATER RECORD</p>
        <h1 id="pageTitle">今天已经喝了</h1>

        <div class="total-display" aria-live="polite">
          <strong id="totalAmount">0</strong>
          <span>ml</span>
        </div>
        <p class="last-added" id="lastAdded">还没有记录，先喝一杯水吧。</p>

        <div class="daily-limit" id="dailyLimitBox">
          <span>今日剧情进度</span>
          <strong><b id="dailyAmount">0</b> / <b id="dailyLimit">1,000</b> ml</strong>
          <small id="dailyLimitHint">今天最多计入 1,000 ml 剧情进度。</small>
        </div>

        <form class="water-form" id="waterForm">
          <label for="waterAmount">增加喝水量</label>
          <div class="input-row">
            <div class="amount-input">
              <input id="waterAmount" name="waterAmount" type="number" min="1" max="5000" inputmode="numeric" step="1" placeholder="输入本次喝水量" autocomplete="off" required>
              <span>ml</span>
            </div>
            <button class="add-button" type="submit">记录</button>
          </div>

          <div class="quick-adds" aria-label="快捷水量">
            <span>快捷</span>
            <button type="button" data-amount="100">+100</button>
            <button type="button" data-amount="200">+200</button>
            <button type="button" data-amount="300">+300</button>
            <button type="button" data-amount="500">+500</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <div class="praise-layer" id="praiseLayer" role="status" aria-live="polite" hidden>
    <div class="praise-emojis" id="praiseEmojis" aria-hidden="true"></div>
    <div class="praise-text" id="praiseText">宝贝蒸蚌！</div>
  </div>

  <div class="overlay manual-overlay" id="manualOverlay" hidden>
    <section class="manual-sheet" role="dialog" aria-modal="true" aria-labelledby="manualTitle">
      <header class="sheet-header">
        <div>
          <p>RESCUE ARCHIVE</p>
          <h2 id="manualTitle">畅畅的救援手册</h2>
        </div>
        <button class="icon-button" type="button" id="manualClose" aria-label="关闭救援手册">关闭</button>
      </header>

      <div class="manual-summary">
        <span>每天最多计入 1,000 ml 剧情进度，达到里程碑后自动播放故事。</span>
        <strong id="manualProgress">1 / 12</strong>
      </div>

      <div class="chapter-grid" id="chapterGrid"></div>
    </section>
  </div>

  <div class="overlay player-overlay" id="storyPlayer" hidden>
    <section class="story-card" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
      <header class="story-header">
        <div class="story-heading">
          <span id="playerBadge">章节</span>
          <h2 id="playerTitle">故事</h2>
        </div>
        <button class="story-close" type="button" id="playerClose">关闭</button>
      </header>

      <div class="story-stage">
        <div class="scene-art">
          <img id="sceneImage" src="assets/scene-01-phone.svg" alt="">
        </div>

        <div class="story-meta">
          <span id="storyAmountLabel">当前累计 0 ml</span>
          <span id="storyProgressText">0 / 0</span>
        </div>

        <div class="dialogue-panel">
          <div class="dialogue-status" id="dialogueStatus">故事开始播放</div>
          <div class="dialogue-lines" id="dialogueLines" aria-live="polite"></div>
        </div>

        <div class="scene-progress" aria-hidden="true"><span id="sceneProgress"></span></div>
      </div>

      <footer class="player-controls">
        <button type="button" id="playerPause">暂停</button>
        <button type="button" id="playerNext">下一句</button>
        <button type="button" id="playerEnd">全部显示</button>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="story.js"></script>
  <script src="app.js"></script>
</body>
</html>
